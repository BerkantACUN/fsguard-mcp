[project]
name = "fsguard-mcp"
version = "0.1.0"
description = "Filesystem + git MCP server confined by symlink-resolved path containment, not string prefix matching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Berkant Acun" }]
keywords = ["mcp", "model-context-protocol", "filesystem", "git", "security", "sandbox"]
dependencies = [
    "mcp>=1.2.0",
    "dulwich>=0.22.0",
]

[project.scripts]
fsguard-mcp = "fsguard_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsguard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
